# Production deployment: app + database.
# 1. Copy .env.example to .env and fill in real secrets.
# 2. docker compose up -d --build
# The app listens on port 3000; put a reverse proxy (Caddy/nginx/Traefik)
# with HTTPS in front of it.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://baucrew:${POSTGRES_PASSWORD}@db:5432/baucrew?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      # Optional integrations — empty means "not configured" (see DEPLOYMENT.md).
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      WATTRO_API_KEY: ${WATTRO_API_KEY:-}
      WATTRO_BASE_URL: ${WATTRO_BASE_URL:-}
      WATTRO_SYNC_INTERVAL_MINUTES: ${WATTRO_SYNC_INTERVAL_MINUTES:-}
      INBOUND_API_KEY: ${INBOUND_API_KEY:-}
    volumes:
      - baucrew_files:/app/storage
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baucrew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: baucrew
    volumes:
      - baucrew_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baucrew -d baucrew"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  baucrew_pgdata:
  baucrew_files:
